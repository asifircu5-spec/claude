<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuzaim Learns</title>
<meta name="description" content="A playful bilingual (Bangla and English) learning app for a 3-year-old.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Da+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --ink:#2b2340; --soft:#6b6385; --card:#ffffff; --line:#f0e4cf;
  --abc:#1098ad;   --abc-bg:#d0f4f8;
  --think:#ff6b6b; --think-bg:#ffe3e3;
  --num:#4dabf7;   --num-bg:#dbefff;
  --code:#37b24d;  --code-bg:#ddf8e2;
  --draw:#f59f00;  --draw-bg:#fff3c4;
  --sci:#845ef7;   --sci-bg:#ece5ff;
  --trav:#12b886;  --trav-bg:#d3f9ec;
  --exp:#e64980;   --exp-bg:#ffdeeb;
  --move:#fd7e14;  --move-bg:#ffe8cc;
  --day:#4c6ef5;   --day-bg:#e0e7ff;
  --story:#ae3ec9; --story-bg:#f8e3ff;
  --season:#d9480f;--season-bg:#ffe4d6;
  --world:#0b7285; --world-bg:#c5f6fa;
  --good:#2f9e44; --bad:#e03131;
  --shadow:0 6px 0 rgba(43,35,64,.12);
  --radius:28px;
  --font:"Baloo 2","Baloo Da 2","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a2b; --ink:#fdf7ff; --soft:#bdb3d6; --card:#2a2640; --line:#3a3456;
    --abc-bg:#123c44; --think-bg:#4a2730; --num-bg:#1f3550; --code-bg:#1f4128; --draw-bg:#4a3d14; --sci-bg:#33285a; --trav-bg:#163f35;
    --exp-bg:#4a1f33; --move-bg:#4a2e14; --day-bg:#262f5c; --story-bg:#3f1f4a; --season-bg:#4a2614; --world-bg:#123a44;
    --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a2b; --ink:#fdf7ff; --soft:#bdb3d6; --card:#2a2640; --line:#3a3456;
  --abc-bg:#123c44; --think-bg:#4a2730; --num-bg:#1f3550; --code-bg:#1f4128; --draw-bg:#4a3d14; --sci-bg:#33285a; --trav-bg:#163f35;
  --exp-bg:#4a1f33; --move-bg:#4a2e14; --day-bg:#262f5c; --story-bg:#3f1f4a; --season-bg:#4a2614; --world-bg:#123a44;
  --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;user-select:none;-webkit-user-select:none;overflow-x:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1}
.brand span{color:var(--think)}.brand span+span{color:var(--num)}
.stars{background:var(--card);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
.back{background:var(--card);border-radius:999px;padding:8px 18px;font-weight:800;font-size:22px;box-shadow:var(--shadow)}
.hidden{display:none!important}

/* Home */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{border-radius:var(--radius);padding:16px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile .em{font-size:clamp(52px,13vw,76px);line-height:1}
.tile b{font-size:clamp(21px,5vw,28px);line-height:1.15}
.tile small{font-size:14px;color:var(--soft);text-align:center;line-height:1.2}
.note{margin-top:20px;font-size:15px;color:var(--soft);line-height:1.45;background:var(--card);border-radius:18px;padding:12px 16px}
.hello{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.hello .ph{width:92px;height:92px;border-radius:50%;flex:none;border:5px solid var(--draw);background:var(--bg);padding:0;overflow:hidden}
.hello .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hello .txt{flex:1;min-width:0}
.hello b{display:block;font-size:clamp(24px,6vw,32px);line-height:1.1}
.hello span{color:var(--soft);font-size:17px}
.lang{flex:none;align-self:flex-start;background:var(--num);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
.hold{display:block;width:100%;touch-action:none;margin-top:16px;position:relative;overflow:hidden;background:var(--card);border-radius:18px;padding:12px;font-weight:800;font-size:17px;color:var(--soft);box-shadow:var(--shadow)}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:var(--line);z-index:0}
.hold.going i{width:100%;transition:width 3s linear}
.hold span{position:relative;z-index:1}

/* Section */
.sec-title{font-size:clamp(28px,7vw,40px);font-weight:800;margin:4px 0 8px}
.tabs{display:flex;gap:10px;margin:8px 0 16px}
.tab{flex:1;border-radius:20px;padding:10px;font-weight:800;font-size:20px;background:var(--card);box-shadow:var(--shadow)}
.tab.on{outline:4px solid var(--accent)}
.play{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.prompt{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(23px,6vw,32px);font-weight:800;text-align:center;min-height:56px;margin-bottom:12px;text-wrap:balance}
.say{background:var(--accent);color:#fff;border-radius:999px;width:52px;height:52px;font-size:26px;flex:none;box-shadow:var(--shadow)}
.modes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.mode{border-radius:999px;padding:6px 15px;font-weight:700;font-size:17px;background:var(--bg);border:3px solid var(--line)}
.mode.on{border-color:var(--accent);background:var(--accent);color:#fff}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.choice{background:var(--bg);border-radius:24px;width:clamp(92px,26vw,150px);height:clamp(92px,26vw,150px);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .12s}
.choice:active{transform:scale(.93)}
.choice svg{width:72%;height:72%}
.choice.num{font-size:clamp(44px,12vw,72px);font-weight:800}
.choice.word{flex-direction:column;font-size:clamp(40px,11vw,60px);font-weight:800;gap:2px;text-align:center;padding:4px}
.choice.word small{font-size:17px;line-height:1.1}
.choice.wide{width:auto;min-width:clamp(120px,40vw,220px);height:auto;padding:14px 18px;font-size:20px;font-weight:800}
.wiggle{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.18)}}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:clamp(40px,10vw,60px);min-height:80px;margin-bottom:14px}
.items button{background:none;font-size:inherit;padding:0 2px;transition:transform .15s}
.items button.counted{transform:scale(1.2);filter:drop-shadow(0 0 6px var(--accent))}
.bigcount{font-size:56px;font-weight:800;color:var(--accent);text-align:center;min-height:70px}
.bigemoji{font-size:clamp(80px,22vw,130px);text-align:center;line-height:1.1;margin-bottom:10px}
.row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 22px;font-weight:800;font-size:21px;box-shadow:var(--shadow);background:var(--bg)}
.btn.go{background:var(--accent);color:#fff;font-size:24px;padding:10px 30px}
.muted{color:var(--soft);font-size:15px;line-height:1.4;text-align:center;margin:12px 0 0}

/* Letters */
.lcard{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--bg);border-radius:24px;padding:12px;margin-bottom:14px;min-height:150px}
.lcard .big{font-size:clamp(84px,24vw,130px);font-weight:800;line-height:1;color:var(--accent)}
.lcard .pic{font-size:clamp(56px,16vw,90px);line-height:1}
.lcard .w{font-size:clamp(24px,6vw,32px);font-weight:800}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.lt{background:var(--bg);border-radius:16px;aspect-ratio:1;font-size:clamp(28px,7vw,36px);font-weight:800;box-shadow:var(--shadow)}
.lt.on{background:var(--accent);color:#fff}

/* Numbers */
.numcard{background:var(--bg);border-radius:24px;padding:12px;text-align:center;margin-bottom:12px}
.numcard .big{font-size:clamp(72px,20vw,110px);font-weight:800;line-height:1;color:var(--accent)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.forms div{background:var(--card);border-radius:14px;padding:6px 4px;min-width:0}
.forms small{display:block;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.forms b{font-size:clamp(22px,6vw,30px);overflow-wrap:anywhere}
.words{display:flex;flex-direction:column;gap:2px;font-size:19px;font-weight:700}
.hund{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.hn{background:var(--bg);border-radius:8px;aspect-ratio:1;font-size:clamp(12px,3.4vw,18px);font-weight:800;padding:0;font-variant-numeric:tabular-nums}
.hn.on{background:var(--accent);color:#fff}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-bottom:12px}
.tpick button{background:var(--bg);border-radius:12px;aspect-ratio:1;font-size:22px;font-weight:800}
.tpick button.on{background:var(--accent);color:#fff}
.trows{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border-radius:14px;padding:8px 12px;font-size:clamp(19px,5vw,24px);font-weight:800;text-align:left;font-variant-numeric:tabular-nums}
.trow .en{color:var(--soft);text-align:right}
.trow.on{outline:4px solid var(--accent)}
.tchant{display:block;grid-column:1/-1;font-size:15px;font-weight:600;color:var(--soft)}

/* Memory */
.mem{display:grid;gap:10px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:1;border-radius:18px;background:var(--accent);font-size:clamp(34px,10vw,56px);box-shadow:var(--shadow);position:relative}
.mcard span{visibility:hidden}
.mcard::before{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.mcard.up{background:var(--bg)}
.mcard.up::before{content:""}
.mcard.up span{visibility:visible}
.mcard.got{opacity:.55}
.pat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(36px,10vw,56px);margin-bottom:16px}
.pat .q{background:var(--bg);border-radius:14px;padding:0 10px;border:3px dashed var(--accent)}

/* Coding */
.board{display:grid;gap:6px;margin:0 auto 14px;max-width:420px;aspect-ratio:1}
.cell{background:var(--code-bg);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,46px)}
.cell.path{outline:3px dashed var(--code)}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;justify-content:center;align-items:center;background:var(--bg);border-radius:18px;padding:8px;margin-bottom:12px;border:3px dashed var(--line)}
.seq .step{width:48px;height:48px;border-radius:12px;background:var(--code);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.seq .step.now{outline:4px solid var(--ink)}
.seq .hint{color:var(--soft);font-size:17px}
.arrows{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:8px;justify-content:center}
.arrow{background:var(--code);color:#fff;border-radius:20px;font-size:38px;box-shadow:var(--shadow)}

/* Drawing pad */
.canvas-wrap{position:relative;border-radius:22px;overflow:hidden;background:#fff;border:4px solid var(--line);touch-action:none}
canvas{display:block;width:100%;height:clamp(300px,52vh,500px);touch-action:none;position:relative;z-index:1}
.guide{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:0}
.guide svg{width:70%;height:80%}
.guide .glyph{font-size:min(62vw,300px);font-weight:700;color:#e4dcf0;line-height:1}
.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.swatch{width:48px;height:48px;border-radius:50%;box-shadow:var(--shadow);border:4px solid transparent}
.swatch.on{border-color:var(--ink);transform:scale(1.1)}
.tool{border-radius:16px;padding:6px 14px;font-weight:800;font-size:18px;background:var(--bg);border:3px solid var(--line)}
.tool.on{border-color:var(--accent);background:var(--accent);color:#fff}

/* Science */
.tank{position:relative;height:200px;border-radius:22px;overflow:hidden;margin:0 auto 14px;max-width:420px;background:linear-gradient(#e7f5ff 0 22%,#74c0fc 22% 100%)}
.tank .obj{position:absolute;left:50%;top:4%;transform:translateX(-50%);font-size:64px;transition:top 1.4s ease-in}

/* Move */
.movecard{text-align:center}
.movecard .act{font-size:clamp(25px,7vw,34px);font-weight:800;margin:4px 0 6px;text-wrap:balance}
.movecard .counter{font-size:72px;font-weight:800;color:var(--accent);min-height:90px}

/* Explore */
.idea{text-align:left;line-height:1.35}
.idea h3{margin:0 0 4px;font-size:clamp(24px,6vw,30px);text-align:center}
.idea .tag{font-size:15px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.idea ol{margin:0;padding-left:24px;font-size:19px}
.idea p{margin:0;font-size:18px}
.idea .safe{background:var(--bg);border-radius:14px;padding:8px 12px;font-size:16px;margin-top:12px}
.fact{text-align:center;font-size:clamp(23px,6vw,30px);font-weight:700;line-height:1.3;min-height:120px;text-wrap:balance}

/* My Day */
.todo{display:flex;flex-direction:column;gap:10px}
.todo button{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:20px;padding:10px 14px;text-align:left;font-size:clamp(20px,5.4vw,26px);font-weight:800;box-shadow:var(--shadow)}
.todo .e{font-size:44px;line-height:1}
.todo .t{flex:1;min-width:0}
.todo .ck{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.todo button.done{opacity:.8}
.todo button.done .ck{background:var(--good);border-color:var(--good)}
.ring{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%), var(--bg) 0)}
.ring div{width:78%;aspect-ratio:1;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .e{font-size:56px;line-height:1}
.ring b{font-size:48px;font-variant-numeric:tabular-nums}
.cue{text-align:center;font-size:clamp(20px,5.5vw,26px);font-weight:800;min-height:64px;text-wrap:balance}
.verdict{background:var(--bg);border-radius:18px;padding:10px 14px;margin-top:12px;font-size:19px;text-align:center;font-weight:700}

/* Stories */
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slist button{background:var(--bg);border-radius:22px;padding:14px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:18px;line-height:1.2}
.slist .e{font-size:54px;line-height:1}
.slist small{font-size:13px;color:var(--soft);font-weight:700}
.page{text-align:center}
.page .scene{font-size:clamp(70px,20vw,110px);line-height:1.15;min-height:130px}
.page .text{font-size:clamp(22px,6vw,30px);font-weight:700;line-height:1.35;min-height:110px;text-wrap:balance}
.page .no{color:var(--soft);font-size:16px;font-variant-numeric:tabular-nums}
.rhyme{white-space:pre-line;font-size:clamp(21px,5.6vw,27px);font-weight:700;line-height:1.5;text-align:center;background:var(--bg);border-radius:20px;padding:14px}

/* Seasons, festivals, world */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cards button{position:relative;background:var(--bg);border-radius:22px;padding:14px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:19px;line-height:1.2;text-align:center}
.cards .e{font-size:52px;line-height:1}
.cards small{font-size:13px;color:var(--soft)}
.cards .now{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.detail{background:var(--bg);border-radius:22px;padding:14px;margin-bottom:14px;text-align:center}
.detail .e{font-size:clamp(72px,20vw,110px);line-height:1.1}
.detail h3{margin:2px 0;font-size:clamp(26px,7vw,34px);line-height:1.15}
.detail p{margin:6px 0 0;font-size:19px;line-height:1.4}
.facts{display:grid;gap:8px;margin-top:10px;text-align:left}
.facts div{background:var(--card);border-radius:14px;padding:8px 12px;min-width:0}
.facts small{display:block;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.facts b{font-size:19px;overflow-wrap:anywhere}
.facts i{font-style:normal;color:var(--soft);font-size:15px;font-weight:600}
.search{width:100%;font-size:20px;padding:10px 16px;border-radius:999px;border:3px solid var(--line);background:var(--bg);margin-bottom:12px}
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.flags button{background:var(--bg);border-radius:18px;padding:8px 4px;box-shadow:var(--shadow);font-size:15px;font-weight:800;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.flags .f{font-size:42px;line-height:1.1}
.flags span{overflow-wrap:anywhere}
.flagbig{font-size:clamp(100px,30vw,160px);line-height:1.05;text-align:center}

/* Parent panel & break */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px;font-size:22px}
.panel p{margin:4px 0;font-size:17px;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;background:var(--bg);border:3px solid var(--line)}
.seg button.on{background:var(--num);border-color:var(--num);color:#fff}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;background:var(--num);border-radius:6px 6px 0 0;min-height:2px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat div{background:var(--bg);border-radius:14px;padding:8px 10px;font-size:16px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.warn{background:var(--season-bg);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.4}
.breakov{display:flex;align-items:center;justify-content:center;text-align:center}
.breakov .inner{align-items:center}
.breakov .e{font-size:120px;line-height:1}
.breakov h2{font-size:clamp(30px,8vw,44px);margin:0}

/* Videos */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vid{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0}
.vid .th{position:relative;aspect-ratio:16/9;background:#000}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.vid .meta{padding:10px 14px 12px;line-height:1.2}
.vid .meta b{display:block;font-size:18px}
.vid .meta small{color:var(--soft);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,16,32,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:25}
.modal .frame{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}
.modal iframe{width:100%;height:100%;border:0}
.modal .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:#fff;color:#2b2340;border-radius:999px;width:56px;height:56px;font-size:30px;font-weight:800}
.modal .src{color:#ddd;font-size:15px;margin-top:10px;text-align:center}
.modal .src a{color:#fff}

/* Celebrate */
.party{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti{position:absolute;top:-40px;font-size:34px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:420px){.arrows{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px)}}
@media (prefers-reduced-motion:reduce){.confetti,.pop,.wiggle{animation:none}.tank .obj{transition:none}}

const BN_W = ["শূন্য","এক","দুই","তিন","চার","পাঁচ","ছয়","সাত","আট","নয়","দশ",
  "এগারো","বারো","তেরো","চৌদ্দ","পনেরো","ষোলো","সতেরো","আঠারো","উনিশ","বিশ",

function bnWord(n){
  if(n <= 100) return BN_W[n];
  const h = Math.floor(n/100), r = n % 100, hs = (h === 1 ? "এক" : BN_W[h]) + "শো";
  return r ? hs + " " + BN_W[r] : hs;
}
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function enWord(n){
  if(n < 20) return ONES[n];
  if(n < 100) return TENS[Math.floor(n/10)] + (n % 10 ? "-" + ONES[n % 10] : "");
  const h = Math.floor(n/100), r = n % 100;
  return ONES[h] + " hundred" + (r ? " and " + enWord(r) : "");
}
function roman(n){
  let s = "";
  for(const [v, r] of [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]])
    while(n >= v){ s += r; n -= v; }
  return s;
}

function speak(text, lang){

    try{ if(AndroidTTS.speakLang) AndroidTTS.speakLang(text, lastLang, .85, 1.15); else AndroidTTS.speak(text); }catch(e){}
    return;
  }
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lastLang; u.rate = .85; u.pitch = 1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}
const sayAgain = () => speak(lastSpoken, lastLang);

function todayKey(d = new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- Progress, stars, time ---------- */

let prog = store.get("nl-prog", {});
function day(){ const k = todayKey(); prog[k] = prog[k] || {t:0, s:{}, v:{}, bonus:0}; return prog[k]; }
function saveProg(){
  const keys = Object.keys(prog).sort(); while(keys.length > 31) delete prog[keys.shift()];
  store.set("nl-prog", prog);
}
function renderStars(){ $("#stars").textContent = "⭐ " + N(stars); }
function addStar(){
  stars++; renderStars(); store.set("ll-stars", stars);
  if(current){ const d = day(); d.s[current] = (d.s[current]||0) + 1; saveProg(); }

}
function celebrate(){

let countMax = 5, countStreak = 0;
function countGame(Z, mode){
  Z.innerHTML = PROMPT + `<div class="items" id="items"></div><div id="below"></div>`; bindSay(Z);
  const round = () => {
    const n = 1 + rand(countMax), thing = pick(THINGS), items = $("#items"), below = $("#below");
    items.innerHTML = ""; below.innerHTML = "";
    for(let i=0;i<n;i++){ const b = document.createElement("button"); b.textContent = thing; items.appendChild(b); }
    if(mode === "count"){
      ask(T("Tap each one and count!","প্রতিটা ছুঁয়ে গোনো!"));
      below.innerHTML = `<div class="bigcount" id="cnt"></div>`;
      let c = 0;
      items.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        if(b.classList.contains("counted")) return;
        b.classList.add("counted"); c++; $("#cnt").textContent = N(c); speak(numWord(c));
        if(c === n){ later(() => right(null, T(`${enWord(n)}! Great counting!`, `${bnWord(n)}! দারুণ গোনা!`)), 700); later(round, 2600); }
      }));
    } else {
      ask(T("How many are there?","কয়টা আছে?"));
      const set = new Set([n]); while(set.size < 3) set.add(1 + rand(Math.max(countMax, 4)));
      const ch = document.createElement("div"); ch.className = "choices";
      shuffle([...set]).forEach(v => {
        const b = choiceBtn(N(v), "choice num");

      });

    }
  };
  round();
}

function thinkRound(Z, mode){

let memPairs = 3;
function memoryGame(Z){
  const pairs = memPairs, faces = shuffle(["🐶","🐱","🐰","🦁","🐸","🐵","🍎","🍌","🚗","⭐","🌙","⚽"]).slice(0, pairs);
  const deck = shuffle([...faces, ...faces]), cols = {3:3, 4:4, 5:5, 6:4}[pairs];
  Z.innerHTML = `<div class="prompt"><button class="say" aria-label="Say it again">🔊</button><span id="q"></span></div><div class="mem" id="mem" style="grid-template-columns:repeat(${cols},1fr)"></div>`;
  bindSay(Z); ask(T("Find the matching pairs!","একই রকম জোড়া খুঁজে বের করো!"));
  let open = [], found = 0, lock = false;
  deck.forEach(f => {
    const c = choiceBtn(`<span>${f}</span>`, "mcard"); c.dataset.f = f;
    c.addEventListener("click", () => {
      if(lock || c.classList.contains("up")) return;
      c.classList.add("up"); open.push(c);
      if(open.length < 2) return;
      lock = true; const [a, b] = open;
      if(a.dataset.f === b.dataset.f){
        a.classList.add("got"); b.classList.add("got"); open = []; lock = false; found++;
        if(found === pairs){ right(null, T("You found them all!","তুমি সবগুলো খুঁজে পেয়েছ!")); memPairs = Math.min(6, pairs + 1); later(() => memoryGame(Z), 2400); }
        else speak(T("A match!","মিলে গেছে!"));
      } else later(() => { a.classList.remove("up"); b.classList.remove("up"); open = []; lock = false; }, 900);
    });
    $("#mem").appendChild(c);
  });
}
function patternGame(Z){
  const sets = [["🍎","🍌","🍇"],["🐶","🐱","🐰"],["🔴","🔵","🟡"],["⭐","🌙","☀️"],["🚗","✈️","⛵"]];
  const s = pick(sets), unit = pick([[0,1],[0,0,1],[0,1,1],[0,1,2]]);
  const shown = unit.length * 2 + rand(unit.length), ans = s[unit[shown % unit.length]];
  let seq = ""; for(let i=0;i<shown;i++) seq += `<span>${s[unit[i % unit.length]]}</span>`;
  Z.innerHTML = PROMPT + `<div class="pat" id="pat">${seq}<span class="q" id="pq">❓</span></div><div class="choices" id="ch"></div>`; bindSay(Z);
  ask(T("What comes next?","এরপর কোনটা আসবে?"));
  shuffle([...s]).forEach(e => {
    const b = choiceBtn(e, "choice num");
    b.addEventListener("click", () => {
      if(e === ans){ $("#pq").textContent = e; right(b); later(() => patternGame(Z), 1600); } else wrong(b);
    });
    $("#ch").appendChild(b);
  });
}

const LEVELS = [
  {size:3, bee:[0,1], flower:[2,1], rocks:[]},
  {size:3, bee:[0,2], flower:[0,0], rocks:[]},
  {size:4, bee:[0,3], flower:[3,3], rocks:[]},
  {size:4, bee:[0,0], flower:[2,2], rocks:[]},
  {size:4, bee:[0,3], flower:[3,0], rocks:[[1,2],[2,1]]},
  {size:5, bee:[0,4], flower:[4,0], rocks:[[2,2],[1,3],[3,1]]},
  {size:5, bee:[2,4], flower:[2,0], rocks:[[2,2],[1,2],[3,2]]}
];
const DIRS = {up:[0,-1,"⬆️","up","উপরে"], down:[0,1,"⬇️","down","নিচে"], left:[-1,0,"⬅️","left","বামে"], right:[1,0,"➡️","right","ডানে"]};
PLAY.code = A => {
  A.innerHTML = `<div class="play">${PROMPT}<div class="board" id="board"></div><div class="seq" id="seq"></div>
    <div class="arrows"><span></span><button class="arrow" data-d="up" aria-label="up">⬆️</button><span></span>
      <button class="arrow" data-d="left" aria-label="left">⬅️</button><button class="arrow" data-d="down" aria-label="down">⬇️</button><button class="arrow" data-d="right" aria-label="right">➡️</button></div>

  bindSay(A);
  let lvl = Math.min(parseInt(store.get("ll-code", 0), 10) || 0, LEVELS.length - 1), prog = [], pos, running = false;
  const Lv = () => LEVELS[lvl], isRock = (x, y) => Lv().rocks.some(r => r[0] === x && r[1] === y);
  const draw = (trail = []) => {
    const b = $("#board"), n = Lv().size; b.style.gridTemplateColumns = `repeat(${n},1fr)`; b.innerHTML = "";
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const c = document.createElement("div"); c.className = "cell";
      if(trail.some(t => t[0] === x && t[1] === y)) c.classList.add("path");
      if(isRock(x, y)) c.textContent = "🪨";
      if(Lv().flower[0] === x && Lv().flower[1] === y) c.textContent = "🌸";
      if(pos[0] === x && pos[1] === y) c.textContent = "🐝";
      b.appendChild(c);
    }
  };
  const drawSeq = (active = -1) => {
    const s = $("#seq"); s.innerHTML = "";
    if(!prog.length){ s.innerHTML = `<span class="hint">${T("Tap arrows to make a plan","পরিকল্পনা বানাতে তীর চিহ্ন ছোঁও")}</span>`; return; }
    prog.forEach((d, i) => { const e = document.createElement("div"); e.className = "step" + (i === active ? " now" : ""); e.textContent = DIRS[d][2]; s.appendChild(e); });
  };
  const start = () => {
    pos = [...Lv().bee]; prog = []; draw(); drawSeq();
    ask(lvl === 0 ? T("Help the bee fly to the flower! Tap the arrows, then press Go.","মৌমাছিকে ফুলের কাছে উড়িয়ে নাও! তীর চিহ্ন ছোঁও, তারপর চলো চাপো।")
                  : T(`Level ${lvl+1}. Help the bee find the flower!`, `লেভেল ${bnDigits(lvl+1)}। মৌমাছিকে ফুলের কাছে নাও!`),
        T("Help 🐝 reach 🌸","🐝-কে 🌸-এর কাছে নাও"));
  };
  A.querySelectorAll(".arrow").forEach(b => b.addEventListener("click", () => {
    if(running || prog.length >= 12) return; prog.push(b.dataset.d); drawSeq(); speak(T(DIRS[b.dataset.d][3], DIRS[b.dataset.d][4]));
  }));
  $("#undo").addEventListener("click", () => { if(!running){ prog.pop(); drawSeq(); } });
  $("#clr").addEventListener("click", () => { if(!running){ prog = []; pos = [...Lv().bee]; draw(); drawSeq(); } });
  $("#run").addEventListener("click", async () => {
    if(running || !prog.length) return;
    running = true; const e = epoch; pos = [...Lv().bee]; const trail = [[...pos]]; draw(trail);
    let ok = true;
    for(let i=0;i<prog.length;i++){
      drawSeq(i); await wait(550); if(e !== epoch) return;
      const [dx, dy] = DIRS[prog[i]], nx = pos[0] + dx, ny = pos[1] + dy;
      if(nx < 0 || ny < 0 || nx >= Lv().size || ny >= Lv().size || isRock(nx, ny)){
        ok = false; speak(isRock(nx, ny) ? T("Bump! A rock is in the way.","ধাক্কা! পথে একটা পাথর।") : T("Bump! That is the edge.","ধাক্কা! এটা কিনারা।")); break;
      }
      pos = [nx, ny]; trail.push([...pos]); draw(trail);
    }
    await wait(300); if(e !== epoch) return;
    if(ok && pos[0] === Lv().flower[0] && pos[1] === Lv().flower[1]){
      right(); later(() => { lvl = (lvl + 1) % LEVELS.length; store.set("ll-code", lvl); running = false; start(); }, 1800);
    } else {
      if(ok) speak(T("Not there yet! Change your plan and try again.","এখনো পৌঁছায়নি! পরিকল্পনা বদলে আবার চেষ্টা করো।"));
      later(() => { pos = [...Lv().bee]; draw(); drawSeq(); running = false; }, 1200);
    }
  });
  start();
};

/* =====================================================================
   DRAW (shared drawing pad)
   ===================================================================== */
function makePad(wrap, opts = {}){
  const cv = wrap.querySelector("canvas"), ctx = cv.getContext("2d");
  let color = opts.color || "#ff4d4d", size = opts.size || 18, erasing = false, drawing = false, last = null;
  const fit = () => {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    let img = null; if(cv.width){ try{ img = ctx.getImageData(0, 0, cv.width, cv.height); }catch(e){} }
    cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
    ctx.setTransform(d, 0, 0, d, 0, 0); if(img) ctx.putImageData(img, 0, 0);
  };
  fit(); window.onresize = () => { if(cv.isConnected && cv.offsetParent) fit(); };
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const line = (a, b) => {
    ctx.globalCompositeOperation = erasing ? "destination-out" : "source-over";
    ctx.strokeStyle = color; ctx.lineWidth = erasing ? size * 1.8 : size; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  };
  cv.addEventListener("pointerdown", e => { drawing = true; last = pt(e); line(last, last); try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
  cv.addEventListener("pointermove", e => { if(!drawing) return; const p = pt(e); line(last, p); last = p; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => cv.addEventListener(ev, () => { drawing = false; }));
  return {
    setColor(c){ color = c; erasing = false; }, setSize(s){ size = s; }, setErase(v){ erasing = v; },
    clear(){ ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); }
  };
}

function countryList(Z, data){
  const all = data.countries.slice().sort((a, b) => (a.iso === "BD" ? -1 : b.iso === "BD" ? 1 : lab(a.name).localeCompare(lab(b.name), L === "bn" ? "bn" : "en")));
  Z.innerHTML = `<div id="cd"></div>
    <input class="search" id="cs" type="search" placeholder="${T("Search a country (grown-ups)","দেশ খুঁজুন (অভিভাবক)")}" autocomplete="off">
    <div class="flags" id="fl"></div>
    <p class="muted">${T(`Source: Wikidata, fetched ${data.fetched}. Leaders and other facts change; check official sources for anything important.`,
      `তথ্যসূত্র: উইকিডাটা, সংগ্রহ ${bnDigits(data.fetched)}। নেতা ও অন্যান্য তথ্য বদলায়; গুরুত্বপূর্ণ বিষয়ে সরকারি সূত্র দেখুন।`)}</p>`;
  const draw = q => {
    const fl = $("#fl"); fl.innerHTML = "";
    const qq = (q || "").trim().toLowerCase();
    all.filter(c => !qq || (c.name.en || "").toLowerCase().includes(qq) || (c.name.bn || "").includes(qq) || c.iso.toLowerCase() === qq).forEach(c => {
      const b = choiceBtn(`<div class="f">${flagOf(c.iso)}</div><span></span>`); b.querySelector("span").textContent = lab(c.name);
      b.addEventListener("click", () => { showCountry(c); window.scrollTo({top: Z.offsetTop - 10, behavior: "smooth"}); });
      fl.appendChild(b);
    });
  };
  const showCountry = c => {
    const row = (lbl, val, extra = "") => val ? `<div><small>${lbl}</small><b></b>${extra}</div>`.replace("<b></b>", `<b>${esc(val)}</b>`) : "";
    const yr = s => s ? (L === "bn" ? bnDigits(s.slice(0,4)) : s.slice(0,4)) : "";
    const people = (arr, titles, status, role, fallbackEn, fallbackBn, both) => {
      const title = labs(titles) || T(fallbackEn, fallbackBn);
      if(!arr || !arr.length){
        if(status === "check") return `<div><small>${esc(title)}</small><b>—</b><i> · ${T("Records disagree, so this is left out. Please check an official source.","তথ্যে মিল নেই, তাই দেখানো হয়নি। সরকারি সূত্র দেখুন।")}</i></div>`;
        return "";
      }
      let note = arr[0].start ? ` · ${T("since","থেকে")} ${yr(arr[0].start)}` : "";
      if(both) note += ` · ${T("head of state and government","রাষ্ট্র ও সরকারপ্রধান")}`;
      const chk = c.checked && c.checked[role];
      if(chk) note += ` · ${T("checked","যাচাই")} ${L === "bn" ? bnDigits(chk.date) : chk.date}`;
      return row(title, labs(arr), note ? `<i>${esc(note)}</i>` : "");
    };
    const same = (c.headOfState || []).length && JSON.stringify((c.headOfState||[]).map(x => x.en)) === JSON.stringify((c.headOfGov||[]).map(x => x.en));
    const cur = (c.currency || []).map(x => lab(x) + (x.code ? ` (${x.code})` : "")).join(", ");
    $("#cd").innerHTML = `<div class="detail"><div class="flagbig">${flagOf(c.iso)}</div><h3></h3><p class="other"></p>
      <div class="facts">
        ${row(T("Capital","রাজধানী"), labs(c.capital))}
        ${row(T("Currency","মুদ্রা"), cur)}
        ${people(c.headOfState, c.headOfStateTitle, c.hosStatus, "headOfState", "Head of state", "রাষ্ট্রপ্রধান", same)}
        ${same ? "" : people(c.headOfGov, c.headOfGovTitle, c.hogStatus, "headOfGov", "Head of government", "সরকারপ্রধান")}
        ${row(T("Parliament","সংসদ"), labs(c.parliament))}
      </div>
      <div class="row"><button class="btn go" id="csay">🔊</button></div></div>`;
    $("#cd h3").textContent = lab(c.name);
    $("#cd .other").textContent = L === "bn" ? c.name.en : (c.name.bn || "");
    const talk = () => speak(T(`${c.name.en}. The capital is ${labs(c.capital) || "not listed"}.`,
      `${lab(c.name)}। রাজধানী ${labs(c.capital) || "জানা নেই"}।`));
    $("#csay").addEventListener("click", talk); talk();
  };
  $("#cs").addEventListener("input", e => draw(e.target.value));
  draw("");
  showCountry(all[0]);
}
function flagQuiz(Z, data){
  let easy = true;
  Z.innerHTML = `<div class="modes"><button class="tool on" id="qe">${T("Well-known","পরিচিত দেশ")}</button><button class="tool" id="qa">${T("All countries","সব দেশ")}</button></div><div id="qz"></div>`;
  $("#qe").addEventListener("click", () => { easy = true; $("#qe").classList.add("on"); $("#qa").classList.remove("on"); round(); });
  $("#qa").addEventListener("click", () => { easy = false; $("#qa").classList.add("on"); $("#qe").classList.remove("on"); round(); });
  const round = () => {
    const pool = easy ? data.countries.filter(c => EASY.includes(c.iso)) : data.countries;
    const opts = shuffle(pool.slice()).slice(0, 3), ans = pick(opts);
    $("#qz").innerHTML = PROMPT + `<div class="flagbig">${flagOf(ans.iso)}</div><div class="choices" id="ch"></div>`; bindSay($("#qz"));
    ask(T("Which country has this flag?","এটা কোন দেশের পতাকা?"));
    opts.forEach(c => {
      const b = choiceBtn("", "choice wide"); b.textContent = lab(c.name);
      b.addEventListener("click", () => {
        if(c === ans){ right(b, T(`Yes! This is the flag of ${c.name.en}!`, `হ্যাঁ! এটা ${lab(c.name)}-এর পতাকা!`)); later(round, 2200); }
        else wrong(b);
      });
      $("#ch").appendChild(b);
    });
  };
  round();
}

  $("#th").addEventListener("click", () => runTimer(20, "🧼", [T("Soap your hands and scrub! Let's count.","হাতে সাবান দিয়ে ঘষো! চলো গুনি।")], T("Now rinse and dry your hands!","এবার পানি দিয়ে ধুয়ে মুছে ফেলো!"), true));
  async function runTimer(total, em, cues, endMsg, countAloud){
    const e = ++epoch;
    $("#tv").innerHTML = `<div class="ring" id="rg" style="margin-top:16px"><div><span class="e">${em}</span><b id="rt">${N(total)}</b></div></div><div class="cue" id="cue"></div>
      <div class="row"><button class="btn" id="tstop">⏹ ${T("Stop","থামো")}</button></div>`;
    $("#tstop").addEventListener("click", () => { epoch++; hush(); $("#tv").innerHTML = ""; });
    const seg = total / cues.length;
    for(let s = 0; s <= total; s++){
      if(e !== epoch) return;
      const left = total - s; $("#rt").textContent = N(left); $("#rg").style.setProperty("--p", (s / total) * 100);
      if(s < total && s % seg === 0){ const c = cues[s / seg]; $("#cue").textContent = c; speak(c); }
      else if(countAloud && s > 0 && s < total && s > 3) speak(numWord(s));
      if(s === total) break;

  }
}
function safety(Z){
  const order = shuffle([...SAFETY.keys()]); let i = 0;
  const round = () => {
    const [em, en, bn, safe, whyEn, whyBn] = SAFETY[order[i++ % order.length]];
    Z.innerHTML = PROMPT + `<div class="bigemoji">${em}</div><div class="prompt" style="font-size:22px"></div><div class="choices" id="ch"></div><div id="why"></div>`; bindSay(Z);
    Z.querySelectorAll(".prompt")[1].textContent = T(en, bn);
    ask(T(`${en}. Is this safe?`, `${bn}। এটা কি নিরাপদ?`), T("Is this safe?","এটা কি নিরাপদ?"));
    let busy = false;
    [[1,"✅",T("Safe","নিরাপদ")],[0,"❌",T("Not safe","নিরাপদ না")]].forEach(([v, ic, lbl]) => {
      const b = choiceBtn(`${ic}<small>${lbl}</small>`, "choice word");
      b.addEventListener("click", () => {
        if(busy) return; busy = true;
        const why = T(whyEn, whyBn), ok = v === safe;
        $("#why").innerHTML = `<div class="verdict"></div><div class="row"><button class="btn go" id="sn">▶ ${T("Next","পরেরটা")}</button></div>`;
        $("#why .verdict").textContent = (safe ? "✅ " + T("Safe! ","নিরাপদ! ") : "❌ " + T("Not safe! ","নিরাপদ না! ")) + why;
        if(ok) right(b, (safe ? T("Yes, that's safe! ","হ্যাঁ, এটা নিরাপদ! ") : T("Right, that's not safe! ","ঠিক, এটা নিরাপদ না! ")) + why);
        else { wrong(b); later(() => speak(why), 1500); }
        $("#sn").addEventListener("click", () => { epoch++; round(); });
      });
      $("#ch").appendChild(b);
    });
  };
  round();
}

function seasonNow(d = new Date()){
  const v = (d.getMonth() + 1) * 100 + d.getDate();
  const s = SEASONS.map((x, i) => [x.start[0] * 100 + x.start[1], i]).sort((a, b) => a[0] - b[0]);
  let cur = s[s.length - 1][1];
  for(const [st, i] of s) if(v >= st) cur = i;
  return cur;
}

let settings = Object.assign({limit: 0, lock: true}, store.get("nl-settings", {}));

function applyLock(){ try{ if(window.AndroidTTS && AndroidTTS.setLocked) AndroidTTS.setLocked(!!settings.lock); }catch(e){} }
function holdToOpen(btn, fn){
  let timer = null;
  const start = e => { e.preventDefault(); btn.classList.add("going"); timer = setTimeout(() => { btn.classList.remove("going"); fn(); }, 3000); };
  const stop = () => { btn.classList.remove("going"); clearTimeout(timer); };
  btn.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("contextmenu", e => e.preventDefault());
}

  B.innerHTML = `<div class="inner"><div class="e">🌳</div><h2>${T("Time for a break!","চলো একটু বিরতি নিই!")}</h2>
    <p style="font-size:20px">${T("Let's play outside, read a book, or have a rest. See you later!","চলো বাইরে খেলি, বই পড়ি, বা একটু বিশ্রাম নিই। পরে দেখা হবে!")}</p>
    <button class="hold" id="bhold" style="max-width:420px"><i></i><span>👪 ${T("Grown-ups: hold 3 seconds for 10 more minutes","অভিভাবক: আরও ১০ মিনিটের জন্য ৩ সেকেন্ড চেপে ধরুন")}</span></button></div>`;
  speak(T("Time for a break! Let's play outside or read a book.","চলো একটু বিরতি নিই! বাইরে খেলি বা বই পড়ি।"));
  holdToOpen($("#bhold"), () => { day().bonus = (day().bonus || 0) + 10; saveProg(); B.classList.add("hidden"); });
}
function tick(){
  if(document.visibilityState !== "visible" || !$("#breakov").classList.contains("hidden")) return;
  const d = day(); d.t += 15; saveProg();
  if(settings.limit && d.t >= (settings.limit + (d.bonus || 0)) * 60 && $("#parent").classList.contains("hidden")) showBreak();
}
setInterval(tick, 15000);

/* ---------- Start ---------- */
applyLock();
renderHome();
if(settings.limit){ const d = day(); if(d.t >= (settings.limit + (d.bonus || 0)) * 60) showBreak(); }
</script>
</body>
</html>
