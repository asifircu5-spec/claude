plugins {
    id 'com.android.application'
}

android {
    namespace 'com.littlelearners.app'
    compileSdk 34

    defaultConfig {
        applicationId project.findProperty('appId') ?: 'com.littlelearners.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [appLabel: project.findProperty('appLabel') ?: 'Nuzaim Learns']
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
