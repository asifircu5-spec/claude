name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check every video exists and can play inside the app
        run: |
          for id in $(grep -oE 'id:"[A-Za-z0-9_-]{11}"' index.html | cut -d'"' -f2 | sort -u); do
            code=$(curl -s -o r.json -w '%{http_code}' "https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=$id")
            if [ "$code" = "200" ]; then
              echo "OK   $id | $(jq -r .author_name r.json) | $(jq -r .title r.json)" | tee -a videos.txt
            else
              echo "FAIL $id | HTTP $code (401 = embedding disabled, 404 = missing)" | tee -a videos.txt
            fi
          done

      - name: Copy the web app into the Android assets
        run: cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk nuzaim-learns.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nuzaim-learns-apk
          path: nuzaim-learns.apk

      - name: Publish as a GitHub release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Download nuzaim-learns.apk below and open it on your Android phone to install."; echo; echo "Video check (YouTube embed service):"; echo '```'; cat videos.txt; echo '```'; } > notes.md
          gh release create "apk-v${{ github.run_number }}" nuzaim-learns.apk \
            --title "Nuzaim Learns APK (build ${{ github.run_number }})" \
            --notes-file notes.md
