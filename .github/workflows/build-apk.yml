name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the web app into the Android assets
        run: cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk little-learners.apk

      - uses: actions/upload-artifact@v4
        with:
          name: little-learners-apk
          path: little-learners.apk

      - name: Publish as a GitHub release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v${{ github.run_number }}" little-learners.apk \
            --title "Little Learners APK (build ${{ github.run_number }})" \
            --notes "Download little-learners.apk below and open it on your Android phone to install."
