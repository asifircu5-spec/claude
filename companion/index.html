<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nuzaim Companion</title>
  <link rel="icon" href="nuzaim.jpg" />
  <style>
    * { box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; user-select: none; }
    body { margin: 0; background: #FFF9C4; color: #333; text-align: center; }
    header { background: #FF9800; color: white; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
    header img { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #FFF; object-fit: cover; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; padding: 15px; max-width: 800px; margin: auto; }
    .card { background: white; border-radius: 18px; padding: 16px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); cursor: pointer; border: 4px solid #4CAF50; font-size: 1.1rem; font-weight: bold; }
    .card:active { transform: scale(0.95); }
    #view { max-width: 750px; margin: 10px auto; padding: 15px; background: #FFF; border-radius: 20px; display: none; box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
    .btn { background: #E91E63; color: #FFF; border: none; padding: 10px 18px; border-radius: 12px; font-size: 1.1rem; margin: 6px; cursor: pointer; }
    canvas { border: 3px dashed #2196F3; border-radius: 12px; background: #FAFAFA; touch-action: none; }
    iframe { width: 100%; height: 240px; border-radius: 12px; border: none; margin-top: 10px; }
  </style>
</head>
<body>

<header>
  <img src="nuzaim.jpg" alt="Nuzaim" />
  <h1>Nuzaim Companion</h1>
</header>

<div class="grid" id="menu">
  <div class="card" onclick="openMod('english')">🔤 English</div>
  <div class="card" onclick="openMod('bangla')">🇧🇩 বাংলা (Bangla)</div>
  <div class="card" onclick="openMod('quant')">🔢 Numbers (1-5)</div>
  <div class="card" onclick="openMod('qual')">🎨 Colors & Sizes</div>
  <div class="card" onclick="openMod('coding')">🤖 Baby Coding</div>
  <div class="card" onclick="openMod('draw')">🖌️ Drawing Pad</div>
  <div class="card" onclick="openMod('science')">🔬 Science & Nature</div>
  <div class="card" onclick="openMod('travel')">✈️ Travelling</div>
  <div class="card" onclick="openMod('life')">🪥 Real-Life Skills</div>
</div>

<div id="view">
  <button class="btn" onclick="goHome()">🏠 Home</button>
  <div id="content"></div>
</div>

<script>
const speak = (txt, lang='en-US') => {
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = lang; u.rate = 0.85;
  speechSynthesis.speak(u);
};

const modules = {
  english: `<h2>Tap to Hear English!</h2>
    <button class="btn" onclick="speak('A for Apple')">🍎 A - Apple</button>
    <button class="btn" onclick="speak('B for Ball')">⚽ B - Ball</button>
    <button class="btn" onclick="speak('C for Cat')">🐱 C - Cat</button>
    <iframe src="https://www.youtube-nocookie.com/embed/hq3yfQnllfQ" allowfullscreen></iframe>`,
  bangla: `<h2>বাংলা বর্ণমালা (Tap to Hear)</h2>
    <button class="btn" onclick="speak('অ তে অজগর', 'bn-BD')">🐍 অ</button>
    <button class="btn" onclick="speak('আ তে আম', 'bn-BD')">🥭 আ</button>
    <button class="btn" onclick="speak('ই তে ইঁদুর', 'bn-BD')">🐭 ই</button>
    <iframe src="https://www.youtube-nocookie.com/embed/5U2G8B0kch0" allowfullscreen></iframe>`,
  quant: `<h2>Quantitative: Count with Nuzaim!</h2>
    <button class="btn" onclick="speak('One Duck')">🦆 1</button>
    <button class="btn" onclick="speak('Two Ducks')">🦆🦆 2</button>
    <button class="btn" onclick="speak('Three Ducks')">🦆🦆🦆 3</button>
    <iframe src="https://www.youtube-nocookie.com/embed/DR-cfDsHCGA" allowfullscreen></iframe>`,
  qual: `<h2>Qualitative: Shapes, Sizes & Colors</h2>
    <button class="btn" style="background:red" onclick="speak('Big Red Circle')">🔴 Big Red</button>
    <button class="btn" style="background:blue;font-size:0.8rem" onclick="speak('Small Blue Square')">🟦 Small Blue</button>
    <iframe src="https://www.youtube-nocookie.com/embed/qhOTU8_1Af4" allowfullscreen></iframe>`,
  coding: `<h2>Coding Logic: Move the Duck to the Pond!</h2>
    <p id="path" style="font-size:2rem">🦆 ⬜ ⬜ 🌊</p>
    <button class="btn" onclick="stepDuck()">➡️ Step Forward</button>`,
  draw: `<h2>Finger Drawing Pad</h2>
    <canvas id="pad" width="300" height="240"></canvas><br/>
    <button class="btn" onclick="initCanvas()">🧹 Clear</button>`,
  science: `<h2>Science: Animals & Weather</h2>
    <button class="btn" onclick="speak('Rain falls from clouds')">🌧️ Rain</button>
    <button class="btn" onclick="speak('Plants need sunlight and water')">🌱 Plants</button>
    <iframe src="https://www.youtube-nocookie.com/embed/pkjJsYsy5cA" allowfullscreen></iframe>`,
  travel: `<h2>Travelling the World</h2>
    <button class="btn" onclick="speak('Airplane flies in the sky')">✈️ Airplane</button>
    <button class="btn" onclick="speak('Train runs on tracks')">🚂 Train</button>
    <iframe src="https://www.youtube-nocookie.com/embed/cSw50Jw0H34" allowfullscreen></iframe>`,
  life: `<h2>Real-Life Habits</h2>
    <button class="btn" onclick="speak('Brush your teeth every morning and night')">🪥 Brush Teeth</button>
    <button class="btn" onclick="speak('Wash your hands with soap')">🧼 Wash Hands</button>
    <iframe src="https://www.youtube-nocookie.com/embed/wCio_xVlgQ0" allowfullscreen></iframe>`
};

let duckPos = 0;
function stepDuck() {
  duckPos = (duckPos + 1) % 4;
  const arr = ['⬜','⬜','⬜','🌊'];
  arr[duckPos] = '🦆';
  document.getElementById('path').innerText = arr.join(' ');
  if (duckPos === 3) speak('Yay! Nuzaim coded the duck to the water!');
}

function openMod(k) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('view').style.display = 'block';
  document.getElementById('content').innerHTML = modules[k];
  if (k === 'draw') initCanvas();
}

function goHome() {
  speechSynthesis.cancel();
  document.getElementById('view').style.display = 'none';
  document.getElementById('menu').style.display = 'grid';
  document.getElementById('content').innerHTML = '';
}

function initCanvas() {
  const c = document.getElementById('pad');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#FF5722';
  let drawing = false;
  const pos = (e) => {
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  c.onpointerdown = (e) => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  c.onpointermove = (e) => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
  c.onpointerup = () => drawing = false;
}
</script>
</body>
</html>
